name: Analyse a video
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube link (public or unlisted)"
        required: true
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -U yt-dlp faster-whisper pillow
      - run: python -u scripts/analyse_video.py "${{ inputs.url }}"
      - name: Save
        run: |
          git config user.name "tall-tale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/analysis
          git commit -m "Video analysis" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
