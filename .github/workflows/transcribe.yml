name: Transcribe audio
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Audio file in the repo"
        required: true
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper
      - run: python -u scripts/transcribe.py "${{ inputs.path }}"
      - name: Save
        run: |
          git config user.name "tall-tale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/analysis
          git commit -m "Transcript" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
