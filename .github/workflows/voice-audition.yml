name: Voice audition
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Render audition clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -u scripts/voice_audition.py
      - name: Commit the clips (temporary, removed after listening)
        run: |
          git config user.name "tall-tale-bot"; git config user.email "actions@users.noreply.github.com"
          git add voice-audition; git commit -m "Voice audition clips" || echo none
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
