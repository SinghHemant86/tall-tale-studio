name: Render prompts
on:
  workflow_dispatch:
    inputs:
      file:
        description: "JSON file of {name: prompt} in the repo"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -u scripts/render_prompts.py "${{ inputs.file }}"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Save
        run: |
          git config user.name "tall-tale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research
          git commit -m "Rendered prompts" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
