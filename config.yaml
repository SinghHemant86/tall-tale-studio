# Tall-Tale Studio — pipeline settings. Change engines here, not in code.

language: hi                    # spoken language. Everything written (title, description, tags,
                                # subtitles, cards) is English; only the thumbnail text may be Hindi

video:
  width: 1280
  height: 720
  fps: 25
  scene_padding_sec: 1.2        # silence after the last line of each scene
  line_gap_sec: 0.45            # pause between lines inside a scene
  subtitles: true
  max_shot_sec: 3.5             # new picture at least this often; stretched automatically to fit the image budget
  subtitle_font: Noto Sans      # subtitles are the English translation of each line

images:
  engine: cloudflare            # cloudflare (free 10k neurons/day) | pollinations (needs paid key) | placeholder
  model: flux
  consistent: true              # draw shots FROM the cast pictures + scene master (FLUX.2 klein), not from scratch
  cast_approval: false          # true = stop after drawing the cast until cast/<story>/APPROVED exists
  max_images: 420               # per video; made over several mornings (~130/day free), the story waits in the queue
  # visual style comes from the story's genre (studio/genres.py)
  negative: "text, watermark, logo, cartoon, bright colors, smiling"

voice:
  engine: elevenlabs            # elevenlabs (needs ELEVENLABS_API_KEY; falls back to edge) | edge | placeholder
  elevenlabs:
    models:                            # best first, with credit cost per character
      eleven_multilingual_v2: 1.0      # most expressive; Hindi + English
      eleven_flash_v2_5: 0.5           # used automatically when credits run low
    reserve: 5000                      # credits never spent by the daily run
    narrator_model: ""                 # e.g. eleven_flash_v2_5 = half-price narration (characters keep the best model)
    narrator: aSbn2iItLXLBz5EjbVhS     # Harsh - deep, whisper, steady
    default_male: d0grukerEzs069eKIauC   # Ranga (Hindi) for small male parts
    default_female: kdkz0RPvRYjuZ1OqDPeY # Devi (Hindi) for small female parts
    cast:                              # reusable character voices; a character sets "role": "<name>"
      old_man: YWaBwjubozVSPD1RgnRa    # Reyaansh - deep Hindi
      elder: ZjpoNq7arSoRlQKCzAEL      # Arun - devotional, expressive older man (village uncle)
      authority: d0grukerEzs069eKIauC  # Ranga - powerful, commanding Hindi (thakur, sarpanch)
      friend: 7b9mYhmnp0y2qSH1FnBL     # Bunty - desi best friend, comic timing (comic relief only)
      young_man: ""
      woman: ""
      young_woman: kdkz0RPvRYjuZ1OqDPeY  # Devi - confident, energetic woman
      child_girl: VOGEEZj2Kly5dP9LrQy8   # Munni - little girl, subtle and slow
      child_boy: d9BvEI0bp2Tmdpqnjwn0    # Saanu - energetic kid
      child: VOGEEZj2Kly5dP9LrQy8
      ghost: mrqRjBf64FNHRBZ9tPdQ      # Anushri - creepy, intimate horror voice
      villain: eWmswbut7I70CIuRsFwP    # Frankie Slim - slick, mischievous
      officer: kdkz0RPvRYjuZ1OqDPeY    # police / official, for true incidents
    voice_settings: {stability: 0.45, similarity_boost: 0.8, style: 0.35}
  narrator: en-IN-PrabhatNeural # channel narrator (a story can set "narrator_voice")
  # narrator speed/pitch below are fallbacks; each genre sets its own
  narrator_rate: "-8%"
  narrator_pitch: "-6Hz"

music:
  folder: music                 # put Pixabay downloads here, named <mood>_<anything>.mp3
  volume_db: -16                # music level under voice
  duck: true                    # music dips while someone is speaking
  default_mood: dread

llm:
  # Used only for mechanical steps (missing image prompts, title/description/tags).
  # Tried in order; first that answers wins. Free model IDs rotate — edit this list.
  providers:
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      models:
        - meta-llama/llama-3.3-70b-instruct:free
        - deepseek/deepseek-r1:free
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      models:
        - gemini-2.5-flash
    - name: groq
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models:
        - llama-3.3-70b-versatile

branding:
  intro: true
  intro_sec: 4
  end_card: true
  end_sec: 7

youtube:
  upload: true
  channel_id: UC1n91AJFKbBX_UxWMDDKtRQ   # Tall-Tale (@TallTale-4u); uploads to any other channel are refused
  privacy: private              # private | unlisted | public — keep private and review first
  category_id: "24"             # Entertainment
  made_for_kids: false
  schedule:                     # publish on a calendar instead of leaving videos private
    enabled: true               # uploads go private with publishAt and go public on the calendar
    timezone: Asia/Kolkata
    long_days: [fri]
    long_time: "18:25"   # live ~2-3 h before the 9-11:30 PM horror peak (after puja, dinner, homework)
    short_time: "17:30"  # after school/office, before evening puja
    # big festival nights: no long video (Shorts still go out); the next long-video day is used instead
    avoid_dates: [2026-10-19, 2026-10-20, 2026-10-29, 2026-11-06, 2026-11-07, 2026-11-08, 2026-11-13]
    min_gap_days: 3      # at least this many days between two long videos
    min_lead_hours: 6

shorts:
  enabled: true                 # vertical Shorts/Reels cut from each long video ("shorts" in the story)
  upload: true                  # also upload them to YouTube (files are always kept for Instagram)
