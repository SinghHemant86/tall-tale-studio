# Tall-Tale Studio — pipeline settings. Change engines here, not in code.

video:
  width: 1280
  height: 720
  fps: 25
  scene_padding_sec: 1.2        # silence after the last line of each scene
  line_gap_sec: 0.45            # pause between lines inside a scene
  subtitles: true
  max_shot_sec: 3.5             # new picture at least this often; stretched automatically to fit the image budget
  subtitle_font: Noto Sans      # Noto covers Hindi (Devanagari) too

images:
  engine: cloudflare            # cloudflare (free 10k neurons/day) | pollinations (needs paid key) | placeholder
  model: flux
  max_images: 110               # per video; Cloudflare free tier is ~130 images/day
  # visual style comes from the story's genre (studio/genres.py)
  negative: "text, watermark, logo, cartoon, bright colors, smiling"

voice:
  engine: elevenlabs            # elevenlabs (needs ELEVENLABS_API_KEY; falls back to edge) | edge | placeholder
  elevenlabs:
    models:                            # best first, with credit cost per character
      eleven_multilingual_v2: 1.0      # most expressive; Hindi + English
      eleven_flash_v2_5: 0.5           # used automatically when credits run low
    reserve: 5000                      # credits never spent by the daily run
    narrator: JBFqnCBsd6RMkjVDRZzb     # placeholder (George). Replace with your chosen narrator's voice ID
    default_male: JBFqnCBsd6RMkjVDRZzb
    default_female: XB0fDUnXU5powFXDhCwa
    cast:                              # reusable character voices; a character sets "role": "<name>"
      old_man: ""                      # fill with ElevenLabs voice IDs (empty = default_male/female)
      young_man: ""
      woman: ""
      young_woman: ""
      child: ""
      ghost: ""                        # breathy / eerie
      villain: ""                      # cold, menacing
      officer: ""                      # police / official, for true incidents
    voice_settings: {stability: 0.45, similarity_boost: 0.8, style: 0.35}
  narrator: en-IN-PrabhatNeural # channel narrator (a story can set "narrator_voice")
  # narrator speed/pitch below are fallbacks; each genre sets its own
  narrator_rate: "-8%"
  narrator_pitch: "-6Hz"

music:
  folder: music                 # put Pixabay downloads here, named <mood>_<anything>.mp3
  volume_db: -16                # music level under voice
  duck: true                    # music dips while someone is speaking
  default_mood: dread

llm:
  # Used only for mechanical steps (missing image prompts, title/description/tags).
  # Tried in order; first that answers wins. Free model IDs rotate — edit this list.
  providers:
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      models:
        - meta-llama/llama-3.3-70b-instruct:free
        - deepseek/deepseek-r1:free
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      models:
        - gemini-2.5-flash
    - name: groq
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models:
        - llama-3.3-70b-versatile

branding:
  intro: true
  intro_sec: 4
  end_card: true
  end_sec: 7

youtube:
  upload: true
  channel_id: UC1n91AJFKbBX_UxWMDDKtRQ   # Tall-Tale (@TallTale-4u); uploads to any other channel are refused
  privacy: private              # private | unlisted | public — keep private and review first
  category_id: "24"             # Entertainment
  made_for_kids: false
